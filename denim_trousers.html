<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --cream: #F0EDE6;
  --cream-dark: #E5E1D8;
  --cream-mid: #EBE7DF;
  --ink: #1A1916;
  --ink-mid: #4A4844;
  --ink-light: #8A8880;
  --ink-faint: #C0BDB8;
  --white: #FAFAF8;
  --border: rgba(26,25,22,0.12);
  --border-mid: rgba(26,25,22,0.22);
}
body { font-family: 'Jost', sans-serif; background: #ffffff; color: var(--ink); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* ── NAV ── */
.nav {
  height: 52px; display: flex; align-items: center;
  padding: 0 24px; border-bottom: 1px solid var(--border);
  background: var(--white); flex-shrink: 0; gap: 16px;
  position: relative;
}
.nav-brand { display: flex; align-items: center; margin-right: auto; text-decoration: none; }
.nav-btn {
  font-family: 'Jost', sans-serif; font-size: 11px; font-weight: 600;
  letter-spacing: 0.10em; text-transform: uppercase;
  padding: 7px 18px; border: 1px solid var(--border-mid); border-radius: 2px;
  background: transparent; color: var(--ink-mid); cursor: pointer;
  text-decoration: none; transition: all 0.2s;
}
.nav-btn:hover { border-color: var(--ink); color: var(--ink); }
.nav-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--ink); color: var(--white);
  font-size: 12px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
  border: none; cursor: pointer; overflow: hidden; flex-shrink: 0;
  -webkit-appearance: none;
}
.nav-avatar img { width: 100%; height: 100%; object-fit: cover; }

/* ── MAIN ── */
.app {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #ffffff;
  min-height: 0;
}

/* ── COMING SOON ── */
.coming-soon {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
  max-width: 480px;
  padding: 48px 32px;
  text-align: center;
}

/* denim trousers preview (flat drawing) */
.denim-preview {
  display: block;
  height: clamp(200px, 34vh, 320px);
  width: auto;
  user-select: none;
}

.coming-label {
  font-size: 9px; font-weight: 600;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--ink-faint);
}

.coming-title {
  font-size: 22px; font-weight: 300;
  letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink); line-height: 1.2;
}

.coming-divider {
  width: 40px; height: 1px;
  background: var(--ink-faint);
}

.coming-msg {
  font-size: 13px; font-weight: 400;
  color: var(--ink-light); letter-spacing: 0.03em;
  line-height: 1.7;
}

.coming-msg strong {
  display: block;
  color: var(--ink-mid);
  font-weight: 500;
  margin-bottom: 4px;
}

/* circle loading spinner */
.spinner {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--border-mid);
  border-top-color: var(--ink-mid);
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const _app = initializeApp({
  apiKey:            "AIzaSyDTbes2CnVEahG0UO3xzZlD9Z5wlSel3XY",
  authDomain:        "tailortech-accounts.firebaseapp.com",
  projectId:         "tailortech-accounts",
  storageBucket:     "tailortech-accounts.firebasestorage.app",
  messagingSenderId: "137614433833",
  appId:             "1:137614433833:web:c78ea40b0d04ba89f3c638"
});
const _auth = getAuth(_app);
window._fb = { auth: _auth, signOut };

onAuthStateChanged(_auth, function(user) {
  if (user) {
    setAccountPopover(user);
    document.getElementById('nav-av').style.display      = '';
    document.getElementById('nav-signout').style.display = '';
    document.getElementById('nav-login').style.display   = 'none';
    if (!window._currentPersonId) {
      getClientJSONP(user.email, user.uid, function(res) {
        if (res && res.success && res.client && res.client['Person ID']) {
          window._currentPersonId = res.client['Person ID'];
          var el = document.getElementById('dd-pid');
          if (el) el.textContent = window._currentPersonId;
        }
      });
    }
  } else {
    var av = document.getElementById('nav-av');
    if (av) { av.style.display = 'none'; av.innerHTML = ''; }
    document.getElementById('nav-signout').style.display = 'none';
    document.getElementById('nav-login').style.display   = '';
    var dd = document.getElementById('nav-dd');
    if (dd) dd.style.display = 'none';
  }
});
</script>

<script>
function toggleDropdown(e) {
  if (e) e.stopPropagation();
  var d = document.getElementById('nav-dd');
  if (!d) return;
  d.style.display = (d.style.display === 'block') ? 'none' : 'block';
}
document.addEventListener('click', function(e) {
  var d  = document.getElementById('nav-dd');
  var av = document.getElementById('nav-av');
  if (d && d.style.display === 'block' && !d.contains(e.target) && av && !av.contains(e.target))
    d.style.display = 'none';
});
function goToAuth() {
  try { sessionStorage.setItem('tt_return_url', window.location.href); } catch(e) {}
  window.location.href = 'https://tailortech.toom.design/auth';
}
function doSignOut() {
  var auth = window._fb && window._fb.auth;
  var so   = window._fb && window._fb.signOut;
  if (auth && so) so(auth);
}
function setAccountPopover(user) {
  if (!user) return;
  var fullname = user.displayName || user.email || '—';
  var av = document.getElementById('nav-av');
  if (av) {
    if (user.photoURL) av.innerHTML = '<img src="' + user.photoURL + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" alt="">';
    else av.textContent = fullname[0].toUpperCase();
  }
  var ddAv = document.getElementById('dd-av');
  if (ddAv) {
    if (user.photoURL) ddAv.innerHTML = '<img src="' + user.photoURL + '" style="width:100%;height:100%;object-fit:cover;" alt="">';
    else ddAv.textContent = fullname[0].toUpperCase();
  }
  var el;
  el = document.getElementById('dd-name');      if (el) el.textContent = fullname;
  el = document.getElementById('dd-email-sub'); if (el) el.textContent = user.email || '';
  el = document.getElementById('dd-pid');       if (el) el.textContent = window._currentPersonId || '—';
}
function getClientJSONP(email, uid, callback) {
  var cbName  = '__ttGetClient_' + Date.now();
  var payload = encodeURIComponent(JSON.stringify({ email: email, uid: uid || '' }));
  var url     = 'https://script.google.com/macros/s/AKfycby2SXeZ-Xezbnc739SuHwvxIf8crKwMpwn-dkRULlimtA9IQBShIKoyMXQUBbh2X3Uk/exec?action=getClient&payload=' + payload + '&callback=' + cbName;
  var script  = document.createElement('script');
  var timer   = setTimeout(function() { cleanup(); callback(null); }, 8000);
  function cleanup() {
    clearTimeout(timer); delete window[cbName];
    if (script.parentNode) document.body.removeChild(script);
  }
  window[cbName]  = function(res) { cleanup(); callback(res); };
  script.onerror  = function()    { cleanup(); callback(null); };
  script.src = url;

<script>
(function () {
  var API = 'https://script.google.com/macros/s/AKfycby2SXeZ-Xezbnc739SuHwvxIf8crKwMpwn-dkRULlimtA9IQBShIKoyMXQUBbh2X3Uk/exec';
  var DELAY = 12000;                 // let people look around first
  var LATER_DAYS = 14;               // "×" — ask again in two weeks
  var NO_DAYS = 90;                  // "No, thanks" (or FALSE in the sheet) — ask again after three months at most
  var DAY = 864e5;
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function jsonp(action, payload, cb) {
    var name = '_ttmkt' + Date.now() + Math.floor(Math.random() * 1e4), s = document.createElement('script');
    var done = function () { try { delete window[name]; } catch (e) { window[name] = undefined; } if (s.parentNode) s.parentNode.removeChild(s); };
    window[name] = function (res) { done(); if (cb) cb(res); };
    s.onerror = function () { done(); if (cb) cb(null); };
    setTimeout(done, 30000);
    s.src = API + '?action=' + action + '&payload=' + encodeURIComponent(JSON.stringify(payload)) + '&callback=' + name;
    document.body.appendChild(s);
  }
  function parseDate(v) {          // "28/10/2026 09:30:00" (script) or anything Date understands
    var m = String(v || '').match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);
    if (m) return new Date(+m[3], m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0)).getTime();
    var t = Date.parse(v); return isNaN(t) ? 0 : t;
  }
  function field(client, name) {
    var k = Object.keys(client || {}).find(function (x) { return x.trim().toLowerCase() === name.toLowerCase(); });
    return k ? String(client[k] == null ? '' : client[k]).trim() : '';

    return !!document.querySelector('.overlay.open, .modal.open, [role="dialog"][open], #welcome-overlay.open, #gender-overlay.open, #tt-consent:not([hidden])');
  }
  function hide(el) { el.classList.remove('show'); setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 350); }
  function show(user) {
    if (document.getElementById('tt-mkt')) return;
    if (busyElsewhere()) { setTimeout(function () { show(user); }, 8000); return; }
    var el = document.createElement('div');
    el.id = 'tt-mkt'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Email updates');
    el.innerHTML = '<button class="m-x" type="button" aria-label="Ask me later">&times;</button>' +
      '<div class="m-eye">Stay in the loop</div>' +
      '<div class="m-h">New fabrics &amp; garments, first</div>' +
      '<p class="m-p">Get an occasional email when we add new fabrics, garments or offers. No spam &mdash; unsubscribe in one click.</p>' +
      '<div class="m-row"><button class="m-yes" type="button">Yes, keep me posted</button><button class="m-no" type="button">No, thanks</button></div>' +
      '<div class="m-fine">You can change this any time in your dashboard.</div>';

    function save(val) {
      lsSet(key, String(Date.now() + (val === 'TRUE' ? 3650 : NO_DAYS) * DAY));
      jsonp('saveClient', { uid: user.uid, email: user.email, data: { 'UID': user.uid, 'Email': user.email, 'Marketing Consent': val } });
      hide(el);
      if (val === 'TRUE' && window.toast) toast('Thank you! We’ll keep you posted ✦');
    }
    el.querySelector('.m-yes').onclick = function () { save('TRUE'); };
    el.querySelector('.m-no').onclick = function () { save('FALSE'); };
    el.querySelector('.m-x').onclick = function () { lsSet(key, String(Date.now() + LATER_DAYS * DAY)); hide(el); };
  }
  window.ttMarketingAsk = function (user) {

    if (snooze > Date.now()) return;

    setTimeout(function () {
      try { sessionStorage.setItem('tt_mkt_checked', '1'); } catch (e) {}          // check once per visit
      jsonp('getClient', { uid: user.uid, email: user.email }, function (res) {
        var c = res && res.client; if (!c) return;
