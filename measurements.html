<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TailorTech — Measurements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#F0EDE6;--cream-mid:#EBE7DF;--ink:#1A1916;--ink-mid:#4A4844;
  --ink-light:#8A8880;--ink-faint:#C0BDB8;--white:#FAFAF8;
  --border:rgba(26,25,22,0.10);--border-mid:rgba(26,25,22,0.20);
}
html,body{height:100%;overflow:hidden}
body{font-family:'Jost',sans-serif;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;}
button{cursor:pointer;font-family:inherit}

/* ── Nav — fixed top ── */
.nav{height:52px;flex-shrink:0;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;gap:16px;z-index:100;position:relative;}
.nav-brand{font-size:12px;font-weight:600;letter-spacing:0.20em;text-transform:uppercase;color:var(--ink);text-decoration:none;margin-right:auto}
.nav-btn{font-family:'Jost',sans-serif;font-size:11px;font-weight:500;letter-spacing:0.10em;text-transform:uppercase;padding:7px 16px;border:1px solid var(--border-mid);border-radius:2px;background:transparent;color:var(--ink-mid);cursor:pointer;transition:all 0.15s;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.nav-btn:hover{background:var(--cream-mid);color:var(--ink)}
.nav-avatar{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--white);font-size:11px;font-weight:600;letter-spacing:0;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;border:none;padding:0;cursor:pointer;-webkit-appearance:none}
.nav-avatar img{width:100%;height:100%;object-fit:cover}

/* ── Form layout — fills remaining height ── */
.form-layout{display:flex;flex:1;min-height:0;}

/* Diagram panel — fixed height, no scroll */
.diag-panel{
  display:none;width:40%;flex-shrink:0;
  background:var(--white);border-right:1px solid var(--border);
  align-items:center;justify-content:center;padding:2rem;
  overflow:hidden;
}
@media(min-width:1024px){.diag-panel{display:flex}}
.diag-img-wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;}
.diag-img{max-width:100%;max-height:100%;object-fit:contain;transition:opacity 0.25s ease,transform 0.25s ease;opacity:1;}
.diag-img.fading{opacity:0;transform:scale(0.97)}
.diag-label{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:9px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-faint);transition:opacity 0.25s;}

/* Form column — flex column so bottom bar sticks */
.form-col{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;}

/* Scrollable content area */
.form-content{flex:1;min-height:0;overflow-y:auto;padding:40px 28px 24px;}

/* ── Fixed bottom action bar ── */
.bottom-bar{
  flex-shrink:0;
  background:var(--white);border-top:1px solid var(--border);
  padding:14px 28px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;
  z-index:50;
}

/* Heading row */
.form-heading{font-size:22px;font-weight:300;color:var(--ink);margin-bottom:4px;letter-spacing:-0.01em}
.form-sub{font-size:12px;color:var(--ink-faint);letter-spacing:0.03em;margin-bottom:20px}

/* ── Garment filter buttons ── */
.garment-btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:28px}
.gbtn{
  font-family:'Jost',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.12em;
  text-transform:uppercase;padding:7px 14px;border-radius:2px;cursor:pointer;
  transition:background 0.15s,color 0.15s,border-color 0.15s;
  border:1px solid var(--border-mid);background:var(--white);color:var(--ink-mid);
}
.gbtn:hover{background:var(--cream-mid);color:var(--ink)}
.gbtn.active-all{background:var(--ink);color:var(--white);border-color:var(--ink)}
.gbtn.active-sub{background:var(--cream-mid);color:var(--ink);border-color:var(--ink-mid)}

/* Section title */
.sec-title{font-size:9px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-light);padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:16px;display:flex;align-items:center;gap:7px;}
.sec-title svg{color:var(--ink-mid)}
.sec-gap{height:28px}

/* Field grids */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px}
@media(max-width:500px){.grid-2{grid-template-columns:1fr}}

/* Field */
.field{display:flex;flex-direction:column}
.field-lbl{font-size:9px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-light);margin-bottom:5px;display:flex;align-items:center;gap:4px;line-height:1.4;}
.field input,.field select{width:100%;padding:9px 12px;background:var(--white);border:1px solid var(--border-mid);border-radius:2px;color:var(--ink);font-size:13px;font-family:'Jost',sans-serif;outline:none;transition:border-color 0.15s;-webkit-appearance:none;}
.field input:focus,.field select:focus{border-color:var(--ink)}
.field input::placeholder{color:var(--ink-faint)}

/* Input with unit */
.unit-wrap{position:relative}
.unit-wrap input{padding-right:2.5rem}
.unit{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--ink-faint);pointer-events:none}

/* Info button */
.info-btn{background:none;border:none;color:var(--ink-faint);padding:0;line-height:1;flex-shrink:0;position:relative;transition:color 0.15s;cursor:pointer;}
.info-btn:hover{color:var(--ink-mid)}
.info-popup{display:none;position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);z-index:200;background:var(--white);border:1px solid var(--border-mid);border-radius:2px;box-shadow:0 8px 24px rgba(0,0,0,0.12);overflow:hidden;width:200px;}
.info-popup p{padding:10px 12px;font-size:11px;color:var(--ink-light);line-height:1.5}
.info-btn.open .info-popup{display:block}

.btn-reset{font-family:'Jost',sans-serif;font-size:11px;font-weight:500;letter-spacing:0.10em;text-transform:uppercase;padding:11px 22px;background:transparent;border:1px solid var(--border-mid);border-radius:2px;color:var(--ink-mid);cursor:pointer;transition:all 0.15s;display:inline-flex;align-items:center;gap:7px;}
.btn-reset:hover{background:var(--cream-mid);color:var(--ink)}
.btn-save{font-family:'Jost',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;padding:11px 28px;background:var(--ink);color:var(--white);border:none;border-radius:2px;cursor:pointer;transition:background 0.15s;display:inline-flex;align-items:center;gap:7px;}
.btn-save:hover{background:#2d2c29}
.btn-save:disabled{opacity:0.45;cursor:not-allowed}
.spin{width:13px;height:13px;border:1.5px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.65s linear infinite;display:none;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg)}}

/* Loading measurements notif */
#meas-loading-notif{
  display:none;
  align-items:center;gap:8px;
  margin-top:10px;
  padding:8px 12px;
  border-radius:2px;
  background:rgba(109,70,180,0.08);
  border:1px solid rgba(109,70,180,0.22);
  font-size:11px;font-weight:500;letter-spacing:0.06em;
  color:#6d46b4;
  transition:opacity 0.2s;
}
#meas-loading-notif.visible{display:flex}
.meas-notif-dot{
  width:7px;height:7px;border-radius:50%;
  border:1.5px solid rgba(109,70,180,0.35);
  border-top-color:#6d46b4;
  animation:spin 0.75s linear infinite;
  flex-shrink:0;
}

/* Toast */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--white);font-size:11px;font-weight:500;letter-spacing:0.06em;padding:11px 20px;border-radius:2px;opacity:0;transition:opacity 0.25s,transform 0.25s;pointer-events:none;z-index:9999;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:#7a2c2c}
</style>
</head>
<body>

<div id="toast"></div>

<!-- Nav -->
<nav class="nav" style="position:relative;">
  <a class="nav-brand" href="https://tailortech.toom.design/">TailorTech</a>
  <button class="nav-avatar" id="nav-av" type="button" onclick="toggleDropdown(event)" style="display:none"></button>
  <a class="nav-btn" id="nav-login" href="#" onclick="goToAuth(); return false;">Log In</a>
  <button class="nav-btn" id="nav-signout" onclick="doSignOut()" style="display:none">Sign out</button>

  <div id="nav-dd" style="display:none;position:absolute;top:52px;right:0;width:260px;background:#FAFAF8;border:1px solid rgba(26,25,22,0.20);border-radius:2px;box-shadow:0 12px 40px rgba(26,25,22,0.16);padding:20px;z-index:9999;font-family:'Jost',sans-serif;">
    <!-- Avatar + Name + Email -->
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
      <div id="dd-av" style="width:40px;height:40px;border-radius:50%;background:#1A1916;color:#FAFAF8;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;"></div>
      <div>
        <div id="dd-name" style="font-size:13px;font-weight:600;color:#1A1916;margin-bottom:2px;">—</div>
        <div id="dd-email-sub" style="font-size:11px;color:#8A8880;word-break:break-all;"></div>
      </div>
    </div>
    <!-- Person ID -->
    <div style="height:1px;background:rgba(26,25,22,0.10);margin-bottom:14px;"></div>
    <div style="margin-bottom:16px;">
      <div style="font-size:9px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#8A8880;margin-bottom:5px;">Person ID</div>
      <div id="dd-pid" style="font-size:15px;font-weight:600;color:#1A1916;letter-spacing:0.04em;">—</div>
    </div>
    <!-- Buttons stacked vertically -->
    <div style="display:flex;flex-direction:column;gap:8px;border-top:1px solid rgba(26,25,22,0.10);padding-top:14px;">
      <a href="https://tailortech.toom.design/dashboard" style="font-family:'Jost',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.10em;text-transform:uppercase;padding:10px 16px;border:none;background:#1A1916;color:#FAFAF8;border-radius:2px;cursor:pointer;text-decoration:none;display:block;text-align:center;">My Dashboard</a>
      <button onclick="doSignOut()" style="font-family:'Jost',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.10em;text-transform:uppercase;padding:10px 16px;border:1px solid rgba(138,48,48,0.30);background:transparent;color:#8a3030;border-radius:2px;cursor:pointer;width:100%;">Sign Out</button>
    </div>
  </div>
</nav>

<!-- ── Single page: always the form ── -->
<div class="form-layout">

  <!-- Diagram -->
  <div class="diag-panel" id="diag-panel">
    <div class="diag-img-wrap">
      <img id="diag-img" class="diag-img" src="" alt="">
      <div class="diag-label" id="diag-label" style="opacity:0"></div>
    </div>
  </div>

  <!-- Form column -->
  <div class="form-col">

    <!-- Scrollable area -->
    <div class="form-content">
      <h2 class="form-heading" id="form-heading">All Measurements</h2>
      <p class="form-sub">Enter your measurements below</p>

      <!-- Garment filter buttons -->
      <div class="garment-btns" id="garment-btns">
        <button class="gbtn active-all" data-filter="all" onclick="setFilter('all')">All</button>
        <button class="gbtn" data-filter="shirt" onclick="setFilter('shirt')">Shirt</button>
        <button class="gbtn" data-filter="hoodie" onclick="setFilter('hoodie')">Hoodie</button>
        <button class="gbtn" data-filter="suit" onclick="setFilter('suit')">Suit</button>
        <button class="gbtn" data-filter="trousers" onclick="setFilter('trousers')">Trousers</button>
      </div>

      <form id="mform" onsubmit="handleSubmit(event)" novalidate>

        <!-- Personal info -->
        <div class="sec-title">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 10-16 0"/></svg>
          Personal Information
        </div>
        <div class="grid-2">
          <div class="field">
            <label class="field-lbl">Email Address</label>
            <input type="email" id="f-email" name="email" placeholder="your@email.com">
          </div>
          <div class="field">
            <label class="field-lbl">Person ID</label>
            <input type="text" id="f-personId" name="personId" placeholder="TT-0001" readonly style="opacity:0.65;cursor:not-allowed;">
          </div>
        </div>

        <!-- Loading measurements notification -->
        <div id="meas-loading-notif">
          <span class="meas-notif-dot"></span>
          Loading measurements…
        </div>

        <div class="sec-gap"></div>

        <!-- Height / Weight -->
        <div class="grid-2">
          <div class="field" id="wrap-height">
            <label class="field-lbl">Height</label>
            <div class="unit-wrap">
              <input type="number" id="f-height" name="height" step="0.1" min="100" max="250" placeholder="0.0" onfocus="focusField('Height','height')">
              <span class="unit">cm</span>
            </div>
          </div>
          <div class="field" id="wrap-weight">
            <label class="field-lbl">Weight</label>
            <div class="unit-wrap">
              <input type="number" id="f-weight" name="weight" step="0.1" min="30" max="300" placeholder="0.0" onfocus="focusField('Weight',null)">
              <span class="unit">kg</span>
            </div>
          </div>
        </div>

        <div class="sec-gap"></div>

        <!-- Volumetric -->
        <div id="sec-vol">
          <div class="sec-title">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l9-4 9 4v10l-9 4-9-4V7z"/></svg>
            Volumetric Measurements
          </div>
          <div class="grid-3" id="grid-vol"></div>
        </div>

        <div class="sec-gap" id="gap-vol-lin"></div>

        <!-- Linear -->
        <div id="sec-lin">
          <div class="sec-title">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h20M2 7l2 5-2 5M22 7l-2 5 2 5"/></svg>
            Linear Measurements
          </div>
          <div class="grid-3" id="grid-lin"></div>
        </div>

      </form>

      <!-- Measurement History -->
      <div id="meas-history" style="display:none;margin-top:48px;padding-bottom:24px">
        <div style="font-size:10px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-light);padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:20px;display:flex;align-items:center;gap:7px;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Measurement History
        </div>
        <div id="meas-history-loading" style="padding:16px 0;color:var(--ink-faint);font-size:12px;letter-spacing:0.04em;">Loading history…</div>
        <div id="meas-history-content"></div>
      </div>

    </div><!-- /form-content -->

    <!-- Fixed bottom bar -->
    <div class="bottom-bar">
      <button type="button" class="btn-reset" onclick="resetForm()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        Reset
      </button>
      <button type="submit" form="mform" class="btn-save" id="btn-save">
        <span id="save-lbl">Save Measurements</span>
        <div class="spin" id="save-spin"></div>
      </button>
    </div>

  </div><!-- /form-col -->
</div>

// ── Diagram ───────────────────────────────────────────────────────
var _diagImg   = null;
var _diagLabel = null;
var _diagActive = null;

function initDiag() {
  _diagImg   = document.getElementById('diag-img');
  _diagLabel = document.getElementById('diag-label');
  // Show front figurine immediately on load
  _diagImg.onload = function() {
    _diagImg.style.opacity = '1';
    _diagLabel.style.opacity = '0';
  };
  _diagImg.src = FRONT_IMG;
  _diagActive = FRONT_IMG;
}

function showDiagImage(url, labelText) {
  if (!_diagImg) return;
  if (url === _diagActive) return;
  _diagActive = url;
  _diagImg.classList.add('fading');
  setTimeout(function() {
    _diagImg.onload = function() {
      _diagImg.classList.remove('fading');
      _diagLabel.textContent = labelText || '';
      _diagLabel.style.opacity = labelText ? '1' : '0';
    };
    _diagImg.onerror = function() {
      _diagImg.src = FRONT_IMG;
      _diagLabel.style.opacity = '0';
      _diagActive = FRONT_IMG;
    };
    _diagImg.src = url;
  }, 200);
}

function focusField(label, key) {
  if (!_diagImg) initDiag();
  if (key && FIELD_IMG[key]) {
    showDiagImage(RAW_BASE + encodeURIComponent(FIELD_IMG[key]), label);
  } else {
    showDiagImage(FRONT_IMG, '');
  }
}

// ── Build fields ──────────────────────────────────────────────────
function makeField(key, label) {
  var wrap = document.createElement('div');
  wrap.className = 'field'; wrap.dataset.key = key;
  var lbl = document.createElement('label');
  lbl.className = 'field-lbl';
  var txt = document.createElement('span'); txt.textContent = label; lbl.appendChild(txt);
  if (HAS_INFO.has(key)) {
    var btn = document.createElement('button');
    btn.type='button'; btn.className='info-btn';
    btn.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg><div class="info-popup"><p>Measurement guide for this field.</p></div>';
    btn.onclick = function(e) { e.preventDefault(); e.stopPropagation(); document.querySelectorAll('.info-btn.open').forEach(function(b){if(b!==btn)b.classList.remove('open')}); btn.classList.toggle('open'); };
    lbl.appendChild(btn);
  }
  wrap.appendChild(lbl);
  var inp = document.createElement('input');
  inp.type='number'; inp.id='f-'+key; inp.name=key; inp.step='0.1'; inp.min='0'; inp.max='999'; inp.placeholder='0.0';
  inp.addEventListener('focus', function(){ focusField(label, key); });
  wrap.appendChild(inp);
  return wrap;
}

(function() {
  var gv = document.getElementById('grid-vol');
  var gl = document.getElementById('grid-lin');
  VOL.forEach(function(f){ gv.appendChild(makeField(f[0],f[1])); });
  LIN.forEach(function(f){ gl.appendChild(makeField(f[0],f[1])); });
  initDiag();
})();

// ── Garment filter ────────────────────────────────────────────────
var currentFilter = 'all';

function setFilter(filter) {
  currentFilter = filter;
  // Update button states
  document.querySelectorAll('.gbtn').forEach(function(b) {
    b.classList.remove('active-all','active-sub');
    if (b.dataset.filter === filter) {
      b.classList.add(filter === 'all' ? 'active-all' : 'active-sub');
    }
  });
  // Update heading
  document.getElementById('form-heading').textContent = LABELS[filter] || 'Measurements';
  // Apply field visibility
  applyFilter(filter);
}

function applyFilter(filter) {
  var set = GARMENT_SETS[filter];
  document.getElementById('wrap-height').style.display = (!set || set.has('height')) ? '' : 'none';
  document.getElementById('wrap-weight').style.display = filter === 'all' ? '' : 'none';
  var anyVol = false, anyLin = false;
  document.querySelectorAll('#grid-vol .field').forEach(function(f){
    var show = !set || set.has(f.dataset.key); f.style.display = show ? '' : 'none'; if(show) anyVol=true;
  });
  document.querySelectorAll('#grid-lin .field').forEach(function(f){
    var show = !set || set.has(f.dataset.key); f.style.display = show ? '' : 'none'; if(show) anyLin=true;
  });
  document.getElementById('sec-vol').style.display     = anyVol ? '' : 'none';
  document.getElementById('sec-lin').style.display     = anyLin ? '' : 'none';
  document.getElementById('gap-vol-lin').style.display = (anyVol && anyLin) ? '' : 'none';
}

// ── Sheets ────────────────────────────────────────────────────────
function sheetsReq(action, payload) {
  payload = payload || {};
  if (['getMeasurements'].indexOf(action) >= 0) {
    return new Promise(function(resolve, reject) {
      var cbName = '__ttMeas_' + Date.now();
      var encoded = encodeURIComponent(JSON.stringify(Object.assign({action:action},payload)));
      var url = SHEETS_API + '?action=' + action + '&payload=' + encoded + '&callback=' + cbName;
      var script = document.createElement('script');
      var timer = setTimeout(function(){ cleanup(); resolve({success:false,records:[],message:'timeout'}); }, 10000);
      function cleanup(){ clearTimeout(timer); delete window[cbName]; if(script.parentNode) document.body.removeChild(script); }
      window[cbName] = function(res){ cleanup(); resolve(res); };
      script.onerror = function(){ cleanup(); reject(new Error('Script load failed')); };
      script.src = url; document.body.appendChild(script);
    });
  }
  return fetch(SHEETS_API, {method:'POST',body:JSON.stringify(Object.assign({action:action},payload))}).then(function(r){return r.json();});
}

// ── Submit ────────────────────────────────────────────────────────
function handleSubmit(e) {
  e.preventDefault();
  var form = document.getElementById('mform');
  if (!form.checkValidity()) { form.reportValidity(); return; }
  var btn=document.getElementById('btn-save'),lbl=document.getElementById('save-lbl'),sp=document.getElementById('save-spin');
  btn.disabled=true; lbl.style.display='none'; sp.style.display='block';
  var data = {garment:currentFilter, dateTime:new Date().toLocaleString()};
  var fd = new FormData(form);
  fd.forEach(function(v,k){ if(v) data[k]=v; });
  var email = document.getElementById('f-email').value.trim();
  sheetsReq('saveMeasurement',{email:email,data:data})
    .then(function(res){
      if(res&&res.success){ showToast('Measurements saved!'); setTimeout(function(){ window.location.href=DASHBOARD; },1500); }
      else showToast('Could not save — check connection','err');
    })
    .catch(function(){ showToast('Network error','err'); })
    .finally(function(){ btn.disabled=false; lbl.style.display=''; sp.style.display='none'; });
}

function resetForm(){ document.getElementById('mform').reset(); }

// ── Toast ─────────────────────────────────────────────────────────
function showToast(msg,type){
  var t=document.getElementById('toast');
  t.textContent=msg; t.className=type==='err'?'err show':'show';
  setTimeout(function(){ t.classList.remove('show'); },3000);
}

// ── Close info popups ─────────────────────────────────────────────
document.addEventListener('click',function(e){

    document.querySelectorAll('.info-btn.open').forEach(function(b){ b.classList.remove('open'); });
});

// ── Init ──────────────────────────────────────────────────────────
(function(){
  var params = new URLSearchParams(window.location.search);
  var email  = params.get('email');
  var filter = params.get('garment') || 'all';

  // Apply garment from URL if provided
  if (filter !== 'all') setFilter(filter);
  else applyFilter('all');

  if (email) {
    var decodedEmail = decodeURIComponent(email);
    var decodedPid   = params.get('personId') ? decodeURIComponent(params.get('personId')) : '';
    var emailEl = document.getElementById('f-email');
    if (emailEl){ emailEl.value=decodedEmail; emailEl.readOnly=true; emailEl.style.opacity='0.6'; emailEl.style.cursor='not-allowed'; }
    var pidEl = document.getElementById('f-personId');
    if (pidEl&&decodedPid){ pidEl.value=decodedPid; pidEl.readOnly=true; pidEl.style.opacity='0.6'; pidEl.style.cursor='not-allowed'; }
    var notif = document.getElementById('meas-loading-notif');
    if (notif) notif.classList.add('visible');
    loadMeasurementHistory(decodedEmail);
  }
})();

// ── History ───────────────────────────────────────────────────────
function loadMeasurementHistory(email){
  if(!email) return;
  var section=document.getElementById('meas-history');
  var loading=document.getElementById('meas-history-loading');
  if(section) section.style.display='block';
  sheetsReq('getMeasurements',{email:email}).then(function(res){
    var notif=document.getElementById('meas-loading-notif'); if(notif) notif.classList.remove('visible');
    if(!res||!res.success||!res.records||res.records.length===0){ if(loading) loading.textContent='No measurement history yet.'; return; }
    if(loading) loading.style.display='none';
    var latest=res.records[0];
    var container=document.getElementById('meas-history-content');
    prefillMeasurements(latest);
    var summaryKeys=[
      {k:'Height [CM]',alt:'height',l:'Height'},{k:'Weight [KG]',alt:'weight',l:'Weight'},
      {k:'Bust girth [CM]',alt:'bustGirth',l:'Bust'},{k:'Waist girth [CM]',alt:'waistGirth',l:'Waist'},
      {k:'Hip girth [CM]',alt:'hipGirth',l:'Hips'},{k:'Shoulder length [CM]',alt:'shoulderLength',l:'Shoulder'},
    ];
    if(container){
      container.innerHTML=res.records.map(function(rec,i){
        var date=rec['Created At']||rec['Updated At']||rec['dateTime']||'';
        var chips=summaryKeys.map(function(k){
          var v=rec[k.k]||(k.alt&&rec[k.alt])||'';
          if(!v||v==='0'||v==='0.0') return '';
          return '<span style="display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;background:var(--cream-mid);border:1px solid var(--border);border-radius:2px;font-size:11px;color:var(--ink-mid)"><strong style="color:var(--ink)">'+parseFloat(v).toFixed(1)+'</strong> '+k.l+'</span>';
        }).filter(Boolean).join('');
        return '<div style="padding:16px 20px;background:var(--white);border:1px solid var(--border);border-radius:2px;margin-bottom:8px"><div style="font-size:9px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px">'+(i===0?'⬤ Latest — ':'Record '+(res.records.length-i)+' — ')+date+'</div>'+(chips||'<span style="font-size:12px;color:var(--ink-faint);font-style:italic">No key measurements recorded</span>')+'</div>';
      }).join('');
    }
  }).catch(function(err){ var notif=document.getElementById('meas-loading-notif'); if(notif) notif.classList.remove('visible'); if(loading) loading.textContent='Could not load history.'; console.error(err); });
}

function prefillMeasurements(rec){
  if(!rec) return;
  var heightEl=document.getElementById('f-height');
  var weightEl=document.getElementById('f-weight');
  var hVal=rec['Height [CM]']||rec['height']||'';
  var wVal=rec['Weight [KG]']||rec['weight']||'';
  if(heightEl&&hVal&&hVal!=='0') heightEl.value=parseFloat(hVal);
  if(weightEl&&wVal&&wVal!=='0') weightEl.value=parseFloat(wVal);
  Object.keys(rec).forEach(function(key){
    var val=rec[key];
    if(!val||val==='0'||val==='0.0'||val==='') return;
    var el=document.getElementById('f-'+key);
    if(el&&el.type==='number'){ var num=parseFloat(val); if(!isNaN(num)&&num>0) el.value=num; }
  });
}
</script>
